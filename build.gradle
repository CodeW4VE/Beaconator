plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Convencion Fabric: <version-del-mod>+<version-de-MC>, p. ej. 0.1.0+1.21
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

repositories {
	mavenCentral()

	// Mod Menu (solo para compilar la integracion opcional; no se empaqueta).
	// Maven de Modrinth: mas fiable en CI que el CDN de TerraformersMC.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

// Mod client-only: no hay splitEnvironmentSourceSets, todo vive en `main` y
// tiene acceso a las clases de cliente.
loom {
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu: solo en tiempo de compilacion (modCompileOnly). No es dependencia
	// de runtime ni se mete en el jar: la integracion solo se activa si el jugador
	// tiene Mod Menu instalado; si no, Fabric ignora el entrypoint.
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// El paquete `model` es matematica pura sin Minecraft: se testea en CI.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}

	// Pasa un .litematic real al importador: ./gradlew test -Dbeaconator.schematic=/ruta/al.litematic
	if (System.getProperty("beaconator.schematic") != null) {
		systemProperty "beaconator.schematic", System.getProperty("beaconator.schematic")
	}

	// Presupuesta la red de agua sobre un plan guardado: ./gradlew test -Dbeaconator.plan=/ruta/plan.json
	// Los tests que leen ficheros de fuera no pueden quedarse en UP-TO-DATE, o el segundo intento
	// no imprime nada y parece que no hay red que contar.
	if (System.getProperty("beaconator.plan") != null) {
		systemProperty "beaconator.plan", System.getProperty("beaconator.plan")
		outputs.upToDateWhen { false }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
