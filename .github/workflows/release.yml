# Push a tag like `v1.1.0` and this builds the mod and publishes a GitHub
# Release with the jar attached. No manual upload needed.
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
# Modrinth is optional: set the repo variable MODRINTH_ID and the secret
# MODRINTH_TOKEN and the last step uploads there too. Without them it is
# skipped and only the GitHub Release happens.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/beaconator-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Game versions, loaders and dependencies are read from fabric.mod.json,
      # so there is one place to keep them right.
      - name: publish to modrinth
        if: env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Not the sources jar. It matches the same pattern and, being first
          # alphabetically, got uploaded as the primary download: everyone
          # pressing Download would have got a jar that is not a mod.
          files: |
            build/libs/beaconator-*+*.jar
            !build/libs/*-sources.jar
          name: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
