# Push a tag like `v1.1.2` and this builds every version of the mod and publishes them, to the
# GitHub Release and to Modrinth. Nothing is uploaded by hand afterwards.
#
#   git tag v1.1.2
#   git push origin v1.1.2
#
# Modrinth is optional: set the repo variable MODRINTH_ID and the secret MODRINTH_TOKEN and the
# last step uploads there too. Without them it is skipped and only the GitHub Release happens.
#
# This used to build one jar with `gradlew build` — the 1.21 one — and publish that alone, while
# the other nine went up by hand. It also let the publishing action guess Modrinth's environment
# field from fabric.mod.json, where `"environment": "*"` reads as `client_and_server`, and that
# is the field whose staff rejects projects over. Both are the scripts' job now, and the
# environment is stated rather than derived.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Ten builds share one dependency cache; without it every release re-downloads ten
          # Minecraft jars and ten Fabric APIs.
          cache: 'gradle'

      # One jar per Minecraft version, each compiled against that version's real mappings, into
      # build/multiversion/. The model tests run on every one of them on the way.
      - name: build every version
        run: |
          chmod +x ./gradlew
          python3 tools/multiversion.py

      # No sources jar to exclude here: multiversion.py copies out the mod jars only, and it was
      # the sources one, first alphabetically, that used to become the primary download.
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/multiversion/beaconator-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Skips whatever is already up, so re-running after a failure finishes the release instead
      # of uploading second copies of the jars that made it.
      - name: publish to modrinth
        if: env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != ''
        run: python3 tools/publish_modrinth.py
